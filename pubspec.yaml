name: sparkio
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.17+36

environment:
  sdk: ^3.10.0

dependencies:
  firebase_analytics: ^11.4.0
  url_launcher: ^6.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  uuid: ^4.5.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.3.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.7
  firebase_core: ^3.6.0
  cloud_functions: ^5.0.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  in_app_review: ^2.0.10
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/icon/sparkio_icon.png
    - assets/icon/sparkio_svg.svg
    - assets/avatars/
    - assets/in_app_icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/sparkio_icon.png
  image_path_ios: assets/icon/sparkio_icon_ios.png
  adaptive_icon_background: "#13172A"
  adaptive_icon_foreground: assets/icon/sparkio_foreground.png
  adaptive_icon_monochrome: assets/icon/sparkio_monochrome.png
  remove_alpha_ios: true
  background_color_ios: "#13172A"
  web:
    generate: true
    image_path: assets/icon/sparkio_icon_ios.png
    background_color: "#13172A"
    theme_color: "#13172A"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_screen/sparkio_splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/sparkio_android12_splash.png
  ios: true
  android: true


